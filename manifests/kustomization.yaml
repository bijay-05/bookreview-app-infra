apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookreview

resources:
  - namespace.yaml
  - ingress/ingress.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/configmap.yaml
  - web/deployment.yaml
  - web/service.yaml
  - database/deployment.yaml
  - database/service.yaml
  - database/configmap.yaml
  - redis/deployment.yaml
  - redis/service.yaml

images:
  - name: book-review-app/web
    newName: docker.io/YOUR_DOCKERHUB_USERNAME/book-review-app/web
    newTag: v1
  - name: book-review-app/api
    newName: docker.io/YOUR_DOCKERHUB_USERNAME/book-review-app/api
    newTag: v2
